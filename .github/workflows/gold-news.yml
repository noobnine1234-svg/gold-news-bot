name: gold-news

on:
  schedule:
    - cron: "2-59/5 * * * *" # every 5 min, offset to dodge top-of-hour cron peak
  workflow_dispatch:

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore dedup DB (bot state lives here, runners are ephemeral)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: goldnews-${{ github.run_id }}
          restore-keys: |
            goldnews-

      - run: npm ci

      - name: Run one fetch cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx src/index.ts --once

      - name: Save dedup DB even on partial failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: goldnews-${{ github.run_id }}
