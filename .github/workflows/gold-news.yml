name: gold-news

on:
  workflow_dispatch: # production runs on Cloudflare Workers cron; this stays for manual runs

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore dedup DB (bot state lives here, runners are ephemeral)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: goldnews-${{ github.run_id }}
          restore-keys: |
            goldnews-

      - run: npm ci

      - name: Run one fetch cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx src/index.ts --once

      - name: Save dedup DB on success only
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: goldnews-${{ github.run_id }}
        # Deliberate policy: a failed run must NOT publish its state. Saving on
        # failure would let an empty/partial DB become the newest prefix match
        # (restore-keys) and shadow the last good dedup DB -> resend storm.
        # Cost of this choice: items sent during a failed cycle are resent once.
